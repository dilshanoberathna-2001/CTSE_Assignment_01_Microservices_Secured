version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: streamlite_secured_mongodb
    ports:
      - "27018:27017"
    volumes:
      - streamlite-secured-mongo-data:/data/db
    networks:
      - streamlite-secured-network

  user-service:
    build: ./user-service
    container_name: streamlite_secured_user
    ports:
      - "5101:5001"
    environment:
      - PORT=5001
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
    networks:
      - streamlite-secured-network

  catalog-service:
    build: ./catalog-service
    container_name: streamlite_secured_catalog
    ports:
      - "5102:5002"
    environment:
      - PORT=5002
      - MONGO_URI=${MONGO_URI}
    depends_on:
      - mongodb
    networks:
      - streamlite-secured-network

  watchlist-service:
    build: ./watchlist-service
    container_name: streamlite_secured_watchlist
    ports:
      - "5103:5003"
    environment:
      - PORT=5003
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - USER_SERVICE_URL=http://user-service:5001/api/users
      - CATALOG_SERVICE_URL=http://catalog-service:5002/api/catalog
    depends_on:
      - mongodb
      - user-service
      - catalog-service
    networks:
      - streamlite-secured-network

  playback-service:
    build: ./playback-service
    container_name: streamlite_secured_playback
    ports:
      - "5104:5004"
    environment:
      - PORT=5004
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - USER_SERVICE_URL=http://user-service:5001/api/users
      - CATALOG_SERVICE_URL=http://catalog-service:5002/api/catalog
      - WATCHLIST_SERVICE_URL=http://watchlist-service:5003/api/watchlist
    depends_on:
      - mongodb
      - user-service
      - catalog-service
      - watchlist-service
    networks:
      - streamlite-secured-network

  frontend:
    build: ./frontend
    container_name: streamlite_secured_frontend
    ports:
      - "3100:3000"
    environment:
      - VITE_USER_SERVICE_URL=http://localhost:5101/api/users
      - VITE_CATALOG_SERVICE_URL=http://localhost:5102/api/catalog
      - VITE_WATCHLIST_SERVICE_URL=http://localhost:5103/api/watchlist
      - VITE_PLAYBACK_SERVICE_URL=http://localhost:5104/api/playback
    depends_on:
      - user-service
      - catalog-service
      - watchlist-service
      - playback-service
    networks:
      - streamlite-secured-network

networks:
  streamlite-secured-network:
    driver: bridge

volumes:
  streamlite-secured-mongo-data:
